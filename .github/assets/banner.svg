<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="t d">
  <title id="t">VaultPi</title>
  <desc id="d">VaultPi: a self-hosted NAS and AI photo pipeline on a Raspberry Pi 4 and AWS.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c51a4a"/>
      <stop offset="1" stop-color="#ff9900"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#21262d" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)" opacity="0.6"/>
  <rect x="0" y="312" width="1280" height="8" fill="url(#accent)"/>

  <!-- cloud (right) -->
  <g transform="translate(1040 30)" fill="none" stroke="#58a6ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <path d="M70 110 a38 38 0 0 1 4 -75 a52 52 0 0 1 98 -8 a44 44 0 0 1 22 83 z"/>
    <path d="M110 70 v-8 M135 70 v-18 M160 70 v-12" stroke="#ff9900"/>
    <circle cx="110" cy="60" r="3" fill="#ff9900" stroke="none"/>
    <circle cx="135" cy="50" r="3" fill="#ff9900" stroke="none"/>
    <circle cx="160" cy="56" r="3" fill="#ff9900" stroke="none"/>
  </g>
  <!-- link: Pi to cloud -->
  <path d="M990 215 C 1030 215, 1020 150, 1075 140" fill="none" stroke="#8b949e" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Raspberry Pi board (centre-right) -->
  <g transform="translate(840 170)">
    <rect width="150" height="100" rx="8" fill="#0f5132" stroke="#3fb950" stroke-width="2"/>
    <rect x="14" y="14" width="44" height="44" rx="4" fill="#30363d" stroke="#8b949e" stroke-width="2"/>
    <rect x="70" y="20" width="26" height="26" rx="3" fill="#21262d" stroke="#8b949e" stroke-width="1.5"/>
    <g fill="#d29922">
      <rect x="16" y="76" width="4" height="8"/><rect x="26" y="76" width="4" height="8"/>
      <rect x="36" y="76" width="4" height="8"/><rect x="46" y="76" width="4" height="8"/>
      <rect x="56" y="76" width="4" height="8"/><rect x="66" y="76" width="4" height="8"/>
    </g>
    <rect x="112" y="12" width="30" height="26" rx="2" fill="#8b949e"/>
    <rect x="112" y="44" width="30" height="26" rx="2" fill="#8b949e"/>
  </g>

  <!-- vault door (far left emblem) -->
  <g transform="translate(70 80)" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round">
    <circle cx="80" cy="80" r="74"/>
    <circle cx="80" cy="80" r="52" stroke-width="3"/>
    <circle cx="80" cy="80" r="10" fill="#0d1117"/>
    <path d="M80 28 V52 M80 108 V132 M28 80 H52 M108 80 H132" stroke-width="4"/>
    <path d="M80 80 L112 48" stroke-width="4"/>
  </g>

  <!-- wordmark: generic system font stack only -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="280" y="140" font-size="76" font-weight="700" fill="#f0f6fc">Vault<tspan fill="#ff4d6d">Pi</tspan></text>
    <text x="283" y="185" font-size="24" fill="#c9d1d9">Personal NAS + AI photo pipeline</text>
    <text x="283" y="220" font-size="18" fill="#8b949e">Raspberry Pi 4 · Docker · Ansible · Terraform · AWS</text>
  </g>
</svg>
