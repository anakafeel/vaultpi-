services:
  n8n:
    # Built from a Dockerfile (see ./Dockerfile), not the bare n8nio/n8n
    # image directly - it adds python3/boto3/numpy so the Photo
    # Search/Duplicate Review workflows' Execute Command nodes can run the
    # scripts under ~/vaultpi. The Dockerfile documents why the base image
    # is pinned to 1.106.3, not :latest (an ARM64 SIGBUS crash on newer
    # versions).
    build:
      context: .
      dockerfile: Dockerfile
    container_name: n8n
    restart: unless-stopped
    ports:
      # Bound to all interfaces rather than the Pi's literal DHCP-assigned
      # IP - a bind to a specific IP fails outright if that IP ever changes
      # (DHCP lease renewal, router reset). LAN-only access is enforced at
      # the firewall (ufw) instead - see ansible/roles/n8n.
      - "5678:5678"
    environment:
      # mDNS hostname instead of the literal IP - anakafeel-pi.local
      # resolves via avahi-daemon (ansible/roles/avahi) and survives DHCP
      # renewals and router changes, unlike a hardcoded IP.
      - N8N_HOST=anakafeel-pi.local
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_SECURE_COOKIE=false
      - WEBHOOK_URL=http://anakafeel-pi.local:5678/
      - GENERIC_TIMEZONE=UTC
      - TZ=UTC
    volumes:
      - n8n_data:/home/node/.n8n
      # Read-only: lets Execute Command nodes run the existing photo-search
      # scripts and read duplicate_report.txt, at the same absolute path
      # they live at on the host, without copying/duplicating them into the
      # image. Same trust boundary as the host already has - both are
      # owned/readable only by the anakafeel user, who also controls n8n.
      - /home/anakafeel/vaultpi:/home/anakafeel/vaultpi:ro
      - /home/anakafeel/.aws:/home/node/.aws:ro
      # Narrow rw mount layered on top of the ro one above (same path, more
      # specific - Docker/the kernel resolve this as an override for that
      # subtree). Only quarantine_file.py's audit log needs to be written
      # from inside the container; the scripts themselves stay read-only.
      - /home/anakafeel/vaultpi/logs:/home/anakafeel/vaultpi/logs:rw
      # Needed for the Quarantine Duplicate webhook: moving a duplicate
      # into _quarantine/ requires write (and delete-on-source) access to
      # the HDD, which no existing mount granted. Same uid=1000/gid=1000
      # trust boundary as the host already has (see hdd_mount_opts in
      # group_vars/all.yml) - the container's node user matches the host's
      # anakafeel uid.
      - /mnt/vaultpi-hdd:/mnt/vaultpi-hdd:rw

volumes:
  n8n_data:
