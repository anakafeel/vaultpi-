# Prometheus, Grafana and node-exporter moved to the k3s cluster
# (github.com/anakafeel/homelab-gitops, infra/monitoring). Only cAdvisor stays
# here: the kubelet's own cAdvisor can't see Docker containers, so the
# cluster's Prometheus scrapes this one on :8080 for per-container metrics of
# the services still on Docker (Immich, n8n, Samba, Portainer).
services:

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8080:8080"
