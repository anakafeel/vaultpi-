---
# Samba serves directly out of the HDD mount (see docker-compose.yml's
# /mnt/vaultpi-hdd:/share volume). It has no HDD-readiness logic of its
# own - it's protected transitively by the hdd_mount role's docker.service
# override (RequiresMountsFor + a content-verification service), which
# delays Docker's own startup until the real HDD is confirmed mounted, so
# by the time this container starts on boot the HDD is guaranteed present.

- name: Ensure ~/vaultpi/samba exists
  ansible.builtin.file:
    path: "{{ vaultpi_dir }}/samba"
    state: directory
    owner: "{{ vaultpi_user }}"
    mode: "0775"

- name: Deploy samba's docker-compose.yml (source of truth is pi-configs/samba/)
  ansible.builtin.copy:
    src: "{{ repo_root }}/pi-configs/samba/docker-compose.yml"
    dest: "{{ vaultpi_dir }}/samba/docker-compose.yml"
    owner: "{{ vaultpi_user }}"
    mode: "0664"

- name: Template samba's .env (SAMBA_USER / SAMBA_PASSWORD, from vault)
  ansible.builtin.template:
    src: .env.j2
    dest: "{{ vaultpi_dir }}/samba/.env"
    owner: "{{ vaultpi_user }}"
    mode: "0600"

- name: Ensure samba is up
  community.docker.docker_compose_v2:
    project_src: "{{ vaultpi_dir }}/samba"
    state: present
