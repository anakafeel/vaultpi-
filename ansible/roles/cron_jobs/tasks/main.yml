---
# The pre-existing @reboot entries in this user's crontab are left alone -
# out of scope for this retrofit, and ansible.builtin.cron only ever
# touches entries tagged with a matching "name" comment, so it can't
# disturb them either way.
#
# sync_photos.sh was deployed by the scripts role but never actually
# scheduled anywhere (no cron entry, no systemd timer) - it had only ever
# been run by hand. Nightly, ahead of the Sunday 3am/4am maintenance jobs,
# so a slow rclone run never overlaps with docker prune or the config
# backup.
#
# 2026-10-24: the AWS side of the project is retired, so the S3 photo sync
# and S3 config backup are now removed instead of scheduled.
- name: Ensure the nightly photo sync job is absent
  ansible.builtin.cron:
    name: "vaultpi photo sync"
    user: "{{ vaultpi_user }}"
    state: absent

- name: Ensure the Sunday 3am docker prune job is scheduled
  ansible.builtin.cron:
    name: "vaultpi docker prune and notify"
    weekday: "0"
    hour: "3"
    minute: "0"
    job: "{{ vaultpi_dir }}/prune_and_notify.sh"
    user: "{{ vaultpi_user }}"

- name: Ensure the Sunday 4am config backup job is absent
  ansible.builtin.cron:
    name: "vaultpi config backup"
    user: "{{ vaultpi_user }}"
    state: absent
