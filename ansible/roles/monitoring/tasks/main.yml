---
# Prometheus, Grafana and node-exporter run on k3s now (homelab-gitops repo).
# This role only keeps the cAdvisor container that the cluster scrapes.
- name: Ensure ~/vaultpi/monitoring exists
  ansible.builtin.file:
    path: "{{ vaultpi_dir }}/monitoring"
    state: directory
    owner: "{{ vaultpi_user }}"
    mode: "0775"

- name: Deploy monitoring's docker-compose.yml (source of truth is pi-configs/monitoring/)
  ansible.builtin.copy:
    src: "{{ repo_root }}/pi-configs/monitoring/docker-compose.yml"
    dest: "{{ vaultpi_dir }}/monitoring/docker-compose.yml"
    owner: "{{ vaultpi_user }}"
    mode: "0644"

# Leftovers from the Docker Prometheus/Grafana. The .env held the CloudWatch
# keys in plaintext; they now live in a SOPS Secret in the cluster. The old
# data on the HDD (prometheus-data, grafana-data) is left alone on purpose.
- name: Remove the old Prometheus/Grafana config and .env
  ansible.builtin.file:
    path: "{{ vaultpi_dir }}/monitoring/{{ item }}"
    state: absent
  loop:
    - .env
    - prometheus
    - grafana

- name: Ensure the monitoring stack is up (removes the retired containers)
  community.docker.docker_compose_v2:
    project_src: "{{ vaultpi_dir }}/monitoring"
    state: present
    remove_orphans: true
