---
- name: Configure VaultPi Raspberry Pi
  hosts: vaultpi
  become: true
  vars_files:
    - vault_vars.yml
  roles:
    - avahi
    # hdd_mount runs before docker: it mounts the dedicated docker-root SD
    # card that docker's daemon.json (deployed by the docker role) points
    # at, so the mount must already be live before Docker's first start -
    # otherwise that first start would write into the boot SD card's root
    # filesystem instead of the intended mount.
    - hdd_mount
    - docker
    - n8n
    - watchtower
    - samba
    - monitoring
    - scripts
    - cron_jobs
