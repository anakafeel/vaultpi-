---
vaultpi_user: anakafeel
vaultpi_home: /home/anakafeel
vaultpi_dir: /home/anakafeel/vaultpi

# HDD mount - matches the fstab entry that is ACTUALLY in effect on the live
# mount (uid=1000/gid=1000, the "gpio" group). This retrofit found the file
# had TWO conflicting lines for this mountpoint: this one (live, working)
# and a second, never-applied one using gid=1002 instead. That stale
# duplicate has since been cleaned up so exactly one line remains, matching
# what was already true at runtime.
hdd_mount_path: /mnt/vaultpi-hdd
hdd_uuid: "2ABC82B9BC827ED7"
hdd_mount_opts: "defaults,nofail,uid=1000,gid=1000"

# Dedicated ext4 SD card for Docker's data-root. Moved off the boot SD card
# (which was down to ~530MB free) and off the HDD (NTFS via ntfs-3g lacks
# proper d_type support, which overlay2 requires for its hardlink/whiteout
# layer storage - a migration attempt there was abandoned mid-copy).
docker_root_mount_path: /mnt/docker-root
docker_root_uuid: "f7676da5-5b7e-4dde-9293-6be1b5883271"
docker_root_mount_opts: "defaults,nofail"

# Repo root, relative to this ansible/ directory, so roles can source
# pi-configs/ and scripts/ without duplicating their content.
repo_root: "{{ playbook_dir }}/.."

# Confirmed via `ip addr` on the Pi (wlan0: 192.168.2.141/24), not assumed.
lan_subnet: "192.168.2.0/24"
n8n_port: 5678

# Tailscale's CGNAT IP range - every device on the tailnet gets an address
# in here, regardless of its physical network. Used to scope firewall rules
# to "LAN or Tailscale" without listing individual tailnet IPs.
tailscale_subnet: "100.64.0.0/10"

# Immich - all data lives on the HDD (see pi-configs/immich/.env.example for
# why Postgres specifically uses a loopback ext4 image rather than the raw
# NTFS mount). immich-machine-learning is deliberately never deployed - see
# pi-configs/immich/docker-compose.yml's header comment - so the built-in
# AI features are also switched off in Immich's own settings (handled by
# the immich role) rather than left enabled with nothing to service them.
immich_port: 2283
immich_upload_location: "{{ hdd_mount_path }}/immich/library"
immich_redis_data_location: "{{ hdd_mount_path }}/immich/redis"
immich_postgres_image_path: "{{ hdd_mount_path }}/immich/postgres.img"
immich_postgres_image_size: "20G"
immich_postgres_mount_path: /mnt/immich-postgres
immich_db_data_location: "{{ immich_postgres_mount_path }}/data"

# External Library folders - existing photos on the HDD, browsed in place
# (read-only) rather than copied into Immich's own managed storage. This
# list is deliberately separate from config/photo_sources.txt (which also
# feeds the unrelated S3 backup sync and, as of the mobile-upload wiring,
# includes Immich's OWN upload folder too - that one must never become an
# External Library, or Immich would be scanning its own managed storage
# back in as a second, duplicate, unowned copy of itself).
immich_external_library_folders:
  - "OneDrive/Pictures"
  - "Saim iphone DCIM (2020-2021)"
  - "Saim iphone DCIM (2021-2023 march)"
  - "Saim Phone DCIM (2026 MAY)"
  - "note 8 dcim"
  - "SAIM PERSONAL FILES/My Pictures"
  - "My Pictures"
  - "camera"
  - "DSLR"
  - "zzz"
  - "gitworkshop pics"
  - "IRUM MARRIAGE PARTY-2002"
